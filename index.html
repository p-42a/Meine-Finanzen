<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Meine Finanzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens ---------- */
:root{
  color-scheme: light;
  --bg:#fafaf9; --raised:#ffffff; --sunken:#f2f2f0; --line:#e8e7e4; --line-2:#d9d8d4;
  --text:#141413; --text-2:#55544f; --muted:#8c8b85;
  --primary:#141413; --on-primary:#fafaf9;
  --inc:#2a78d6; --exp:#eb6834; --data:#2a78d6;
  --good:#1f7a3a; --bad:#c2392f; --warn:#a96500;
  --focus:rgba(42,120,214,.22); --scrim:rgba(20,20,19,.32);
  --tip-shadow:0 8px 24px rgba(0,0,0,.08);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6; --c-other:#aeada7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0f0f; --raised:#181818; --sunken:#151515; --line:#242424; --line-2:#333;
    --text:#ececea; --text-2:#b4b3ad; --muted:#7d7c77;
    --primary:#ececea; --on-primary:#0f0f0f;
    --inc:#3987e5; --exp:#d95926; --data:#3987e5;
    --good:#5cbf7a; --bad:#f07468; --warn:#e0a63a;
    --focus:rgba(57,135,229,.35); --scrim:rgba(0,0,0,.6);
    --tip-shadow:0 8px 24px rgba(0,0,0,.5);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c-other:#5c5c57;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0f0f; --raised:#181818; --sunken:#151515; --line:#242424; --line-2:#333;
  --text:#ececea; --text-2:#b4b3ad; --muted:#7d7c77;
  --primary:#ececea; --on-primary:#0f0f0f;
  --inc:#3987e5; --exp:#d95926; --data:#3987e5;
  --good:#5cbf7a; --bad:#f07468; --warn:#e0a63a;
  --focus:rgba(57,135,229,.35); --scrim:rgba(0,0,0,.6);
  --tip-shadow:0 8px 24px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c-other:#5c5c57;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body{transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
.num,.v,.amt,.a,.hero{font-variant-numeric:tabular-nums}
.app{max-width:680px;margin:0 auto;padding:20px 20px 120px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 4px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hdr-r{display:flex;align-items:center;gap:2px}
.monthpick{display:flex;align-items:center;gap:0}
.monthpick span{min-width:112px;text-align:center;font-weight:500;font-size:14px}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:17px;display:grid;place-items:center}
.iconbtn:hover{background:var(--sunken);color:var(--text)}
.statusline{font-size:12px;color:var(--muted);margin:0 0 8px}
.statusline:empty{display:none}

/* section nav */
.jump{position:sticky;top:0;z-index:4;display:flex;gap:18px;overflow-x:auto;padding:12px 0;margin:0 0 8px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:0;background:none;padding:0;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.jump button:hover{color:var(--text)}
section{scroll-margin-top:52px}
.sechead{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin:44px 0 14px;display:flex;justify-content:space-between;align-items:baseline}

/* blocks */
.card{margin:0 0 32px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.card h2 small{font-weight:400;color:var(--muted);margin-left:6px}

/* hero numbers */
.hero{margin:6px 0 22px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:2px 0 14px}
.hero .row{display:flex;gap:28px;flex-wrap:wrap}
.hero .row div{font-size:13px;color:var(--muted)}
.hero .row b{display:block;font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;margin-right:6px;vertical-align:1px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.delta{font-size:12px;color:var(--muted);font-weight:400}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 0 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:12px 0}
.kpi + .kpi{padding-left:16px;border-left:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:600;margin-top:1px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}

/* notices */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;margin-bottom:10px;font-size:13px;color:var(--text-2)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.banner.warn::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.banner span{flex:1}

/* buttons */
.btn{border:1px solid var(--line-2);background:transparent;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{opacity:.88;background:var(--primary)}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}

/* chart */
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:flex;align-items:center}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--tip-shadow);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:2}
.tip b{display:block;margin-bottom:3px;font-weight:600}
.tip div{display:flex;align-items:center;font-variant-numeric:tabular-nums;color:var(--text-2)}
svg text{font-family:inherit}

/* category rows */
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--text)}
.catrow .a{font-size:14px;font-weight:500;text-align:right}
.catrow .a small{color:var(--muted);font-weight:400;margin-left:8px;display:inline-block;min-width:30px}
.bar{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--data)}
.bar i.over{background:var(--bad)} .bar i.near{background:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}

/* inputs */
input,select,textarea{background:var(--raised);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--data);box-shadow:0 0 0 3px var(--focus)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{flex:1 1 140px;min-width:0}

/* transactions */
.daygroup{font-size:12px;color:var(--muted);margin:22px 0 2px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:hover .t1{color:var(--data)}
.tx .ic{width:24px;text-align:center;font-size:17px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
.tx .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:500;font-size:14px;white-space:nowrap}

/* fab */
.fab{position:fixed;right:max(20px,calc(50% - 320px));bottom:calc(24px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);font-size:26px;font-weight:300;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:6;line-height:1;display:grid;place-items:center}
.fab:hover{transform:scale(1.04)}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:620px){.overlay{align-items:center}}
.sheet{background:var(--raised);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border:1px solid var(--line);animation:up .2s ease-out}
@media(min-width:620px){.sheet{border-radius:18px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(16px);opacity:0}}
.sheet h3{margin:0 0 16px;font-size:16px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:7px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .seg button.on{background:var(--line-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--line-2)}}
.amountin{font-size:34px;font-weight:600;text-align:center;padding:10px;border:0!important;box-shadow:none!important;background:transparent!important;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.actions .r{display:flex;gap:8px;margin-left:auto}

/* lists in settings */
.list .li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li input{border-color:transparent;background:transparent;padding:6px 8px}
.list .li input:hover{border-color:var(--line-2)}
.list .li input:focus{border-color:var(--data);background:var(--raised)}
.list .li .grow{flex:1;min-width:0;font-size:14px}
.list .li .sub{font-size:12px;color:var(--muted)}
.list .li .ic{width:24px;text-align:center}
.inline{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.inline > *{flex:1 1 120px}
.inline .btn{flex:0 0 auto}
.emoji-in{max-width:52px;text-align:center}
.chip{font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.note{font-size:12px;color:var(--muted);margin-top:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));white-space:nowrap;display:flex;align-items:center;transform:translate(-50%,6px);background:var(--primary);color:var(--on-primary);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* upload */
.drop{display:flex;align-items:center;gap:14px;border:1px dashed var(--line-2);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;margin-top:8px}
.drop:hover,.drop.over{border-color:var(--data);background:color-mix(in srgb,var(--data) 6%,transparent)}
.drop .big{width:36px;height:36px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:16px;color:var(--text-2);flex:none}
.drop b{font-size:14px;font-weight:500;display:block}
.drop .note{margin:0}
table.prev{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
table.prev td,table.prev th{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
table.prev th{color:var(--muted);font-weight:500}

/* collapsible settings */
details.card{margin:0;border-bottom:1px solid var(--line)}
details.card:first-of-type{border-top:1px solid var(--line)}
details.card>summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'';width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.card[open]>summary::after{transform:rotate(45deg)}
details.card>.body{padding:0 0 18px}
details.card>summary small{font-weight:400;color:var(--muted);margin-left:8px;margin-right:auto}
.ico{display:block;flex:none}
.ci{display:inline-flex;vertical-align:-3px;margin-right:10px;color:var(--muted)}
.tx .ic,.list .li .ic{color:var(--text-2);display:flex;justify-content:center}
.icopick{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:0 0 34px!important}
.icopick:hover{border-color:var(--line-2);color:var(--text)}
.iconbtn.del{width:30px;height:30px}
.iconbtn.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.icogrid button{aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icogrid button:hover{border-color:var(--line-2);color:var(--text)}
.icogrid button.on{border-color:var(--primary);color:var(--text);background:var(--sunken)}
.donut{display:flex;gap:28px;align-items:center}
@media(max-width:560px){.donut{flex-direction:column;gap:18px;align-items:stretch}.dwrap{align-self:center}}
.dwrap{position:relative;width:180px;height:180px;flex:none}
.dwrap svg{display:block}
.seg{transition:opacity .15s,stroke-width .15s;cursor:pointer}
.donut.focus .seg:not(.on){opacity:.22}
.donut .seg.on{stroke-width:24}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 36px}
.dc b{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dc .dl{font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg{flex:1;min-width:0}
.lrow{display:grid;grid-template-columns:8px 16px minmax(0,1fr) auto 38px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;transition:opacity .15s}
.lrow:last-child{border-bottom:0}
.donut.focus .lrow:not(.on){opacity:.4}
.lrow .sw{width:8px;height:8px;border-radius:50%}
.lrow .ci{margin:0}
.lrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .am{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.lrow .pc{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.quick{margin:10px 0 36px}
.qrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);padding-bottom:4px}
.qrow:focus-within{border-color:var(--text)}
.sign{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:transparent;font-size:22px;font-weight:400;cursor:pointer;flex:none;line-height:1;color:var(--exp)}
.sign.income{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line-2))}
.sign.expense{border-color:color-mix(in srgb,var(--exp) 50%,var(--line-2))}
input.qamt{border:0!important;box-shadow:none!important;background:transparent!important;font-size:38px;font-weight:600;letter-spacing:-.03em;padding:4px 0;font-variant-numeric:tabular-nums;min-width:0}
.qeur{font-size:24px;color:var(--muted);font-weight:500}
input.qnote{border:0!important;box-shadow:none!important;background:transparent!important;padding:10px 0;font-size:15px;border-bottom:1px solid var(--line)!important;border-radius:0}
.qhint{font-size:12px;color:var(--muted);margin:14px 0 10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chipbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--line);background:var(--raised);border-radius:12px;cursor:pointer;text-align:left;color:var(--text-2);min-height:72px;transition:border-color .12s,background .12s,transform .08s}
.chipbtn span{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;font-size:12.5px;font-weight:500;line-height:1.25;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chipbtn:hover{border-color:var(--line-2)}
.chipbtn:active{transform:scale(.97)}
.chipbtn.sug{border-color:var(--primary);background:var(--sunken);color:var(--text)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}
.toast.has-act.show{pointer-events:auto}
.tact{flex:none;border:0;background:none;color:var(--on-primary);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:10px;padding:0;font-size:13px}
.importcard{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 32px}
body.dragging::after{content:'Datei loslassen zum Importieren';position:fixed;inset:12px;border:2px dashed var(--data);border-radius:18px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font-weight:600;z-index:40;pointer-events:none}
.app{max-width:1080px}
.rangebar{display:flex;align-items:center;gap:4px;margin:10px 0 18px;flex-wrap:wrap}
.rangebar button{border:1px solid transparent;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.rangebar button:hover{color:var(--text)}
.rangebar button.on{background:var(--primary);color:var(--on-primary)}
.rangebar .per{margin-left:auto;font-size:12px;color:var(--muted)}
.kpigrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:760px){.kpigrid{grid-template-columns:repeat(4,1fr)}}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--raised)}
.tile .l{font-size:12px;color:var(--muted);display:flex;align-items:center}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

};

}
function delTx(id){
  S.tx = S.tx.filter(x=>x.id!==id);

let autoBooked=false;
function autoBook(){
  if(autoBooked) return; autoBooked=true;
  const due=dueRecurring(); if(!due.length) return;
  const key=monthKey(new Date());
  for(const r of due){ const id=`rec-${r.id}-${key}`;
    if(!S.tx.some(t=>t.id===id)) putTx({id,type:r.type,amount:r.amount,date:`${key}-${pad(Math.min(r.day||1,28))}`,cat:r.cat,note:r.note||'',created:Date.now()});
    r.last=key; }
  saveSettings();
  toast(due.length===1?`${due[0].note||cat(due[0].cat).name} automatisch gebucht`:`${due.length} wiederkehrende Buchungen gebucht`);
}
function startLocal(reason){
  S.mode='local';
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d.settings) S.settings=d.settings; if(Array.isArray(d.tx)) S.tx=d.tx; } }catch(e){}
  setStatus(esc(reason||''));

async function init(){
  render();
  if(!(window.claude && typeof window.claude.use==='function')) return startLocal('');
  let d=null,u=null;
  try{ [d,u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  try{ uid = u ? await u.id() : null; }catch(e){ uid=null; }
  if(!d || !uid) return startLocal('Nicht angemeldet – Daten nur in diesem Browser gespeichert.');
  db=d; S.mode='db';
  settingsRef = db.doc(`data/users/${uid}/settings`);
  txCol = db.doc(`data/users/${uid}/ledger`).collection('tx');
  let confirmed={s:false,t:false};
  const timer=setTimeout(()=>{ if(!(confirmed.s&&confirmed.t)) setStatus('⏳ Daten sind gerade nicht erreichbar – Anzeige ist evtl. nicht aktuell.'); },10000);
  const done=()=>{ if(confirmed.s&&confirmed.t){ clearTimeout(timer); setStatus(''); } };
  settingsRef.onSnapshot(snap=>{
    if(snap.exists){ const data=JSON.parse(JSON.stringify(snap.data())); S.settings={...structuredClone(DEFAULT_SETTINGS),...data}; }
    if(!snap.metadata.fromCache) confirmed.s=true; done(); render();
  }, e=>{ clearTimeout(timer); setStatus('⚠️ Verbindung zum Speicher unterbrochen.'); });
  txCol.onSnapshot(snap=>{
    S.tx = snap.docs.map(x=>({id:x.id,...x.data()}));
    if(!snap.metadata.fromCache) confirmed.t=true; done(); render();
  }, e=>{ clearTimeout(timer); setStatus('⚠️ Verbindung zum Speicher unterbrochen.'); });
}

function wireLine(){

let chartData=[];
function chartSVG(n=6){
  const keys=rangeKeys(n); const rk=new Set(rangeKeys());

  const W=panelW(true),H=W<500?200:240,pl=44,pr=8,pt=12,pb=26;
  const maxV=Math.max(1,...chartData.map(d=>Math.max(d.inc,d.exp)));
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(maxV))); const f=maxV/p; return ([1,1.5,2,2.5,3,4,5,6,8,10].find(x=>f<=x))*p; })();
  const ih=H-pt-pb, iw=W-pl-pr, band=iw/keys.length, bw=Math.min(26,band*0.28), gap=2;
  const y=v=>pt+ih-(v/nice)*ih;
  const bar=(x,v,color)=>{ if(v<=0) return ''; const top=y(v), h=pt+ih-top, r=Math.min(4,h);
    return `<path d="M${x},${pt+ih} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${pt+ih} Z" style="fill:${color}"/>`; };
  let g='';
  for(let i=0;i<=4;i++){ const v=nice*i/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1" ${i?'stroke-dasharray="2 4"':''}/>`;

    g+=`<rect class="hit" data-i="${i}" x="${pl+band*i}" y="${pt}" width="${band}" height="${ih+pb}" rx="8" style="cursor:pointer;fill:${sel?'var(--sunken)':'transparent'}"/>`;
    g+=bar(cx-bw-gap/2,d.inc,'var(--inc)')+bar(cx+gap/2,d.exp,'var(--exp)');

    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:${sel?'var(--text)':'var(--text-2)'}" font-weight="${sel?600:400}">${MSHORT[mm-1]}${mm===1?' '+String(yy).slice(2):''}</text>`;

/* ---------- CSV import ---------- */
function splitCSV(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const sample=lines.slice(0,10).join('\n');
  const delim = [';','\t',','].map(d=>[d,(sample.split(d).length)]).sort((a,b)=>b[1]-a[1])[0][0];
  return lines.map(line=>{ const out=[]; let cur='',q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else if(ch==='"') q=true; else if(ch===delim){ out.push(cur.trim()); cur=''; } else cur+=ch; }
    out.push(cur.trim()); return out; });
}
function parseImport(text,name){
  const rows=splitCSV(text); if(rows.length<2) return toast('Keine Daten erkannt.');
  // header row = first row with ≥3 cells containing a date-ish or amount-ish label
  let hi=rows.findIndex(r=>r.length>=3 && r.some(c=>/datum|date|buchung/i.test(c)) && r.some(c=>/betrag|amount|umsatz|soll|haben/i.test(c)));
  if(hi<0) hi=0;
  const head=rows[hi].map(h=>h.toLowerCase());
  const find=(...res)=>{ for(const re of res){ const i=head.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  const map={
    date: find(/^buchungstag/,/buchungsdatum/,/^datum/,/date/,/valuta|wertstellung/),
    amount: find(/^betrag/,/betrag/,/amount/,/umsatz/),
    text: find(/verwendungszweck/,/beschreibung/,/description/,/buchungstext/),
    party: find(/empf|auftraggeber|beg[üu]nstigt|zahlungspflichtig|payee|name|gegen/),
  };
  S.importRows={head:rows[hi], rows:rows.slice(hi+1), map, name:name||''};
  if(map.date>=0 && map.amount>=0 && importCandidates().length){ doImport(); return; }
  render(); setTimeout(()=>goTo('sec-upload'),30);
}
function importCandidates(){
  const I=S.importRows; if(!I) return [];
  const {date,amount,text,party}=I.map; const out=[];
  for(const r of I.rows){
    const d=parseDate(r[date]); const a=parseAmount(r[amount]);
    if(!d || !isFinite(a) || a===0) continue;
    const note=[r[party],r[text]].filter(Boolean).join(' · ').replace(/\s+/g,' ').slice(0,140);
    const type=a<0?'expense':'income';
    const c=suggestCat(note,type) || (type==='expense'?(catsOf('expense').find(c=>c.id==='sonstiges')||catsOf('expense')[0])?.id:(catsOf('income').find(c=>c.id==='sonst_ein')||catsOf('income')[0])?.id);
    const dup=S.tx.some(t=>accOf(t)===(S.importAcc||accounts()[0].id) && t.date===d && Math.abs(t.amount-Math.abs(a))<0.005 && t.type===type && (t.note||'')===note);
    out.push({date:d,amount:Math.abs(a),type,note,cat:c,dup});
  }
  return out;
}

  const I=S.importRows; if(!I) return '';
  const opts=sel=>`<option value="-1">–</option>`+I.head.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||('Spalte '+(i+1)))}</option>`).join('');
  const c=importCandidates(); const fresh=c.filter(x=>!x.dup);
  let h=`<div class="row2" style="margin-top:12px">
    <div class="field"><label>Datum</label><select data-map="date">${opts(I.map.date)}</select></div>
    <div class="field"><label>Betrag</label><select data-map="amount">${opts(I.map.amount)}</select></div>
    <div class="field"><label>Verwendungszweck</label><select data-map="text">${opts(I.map.text)}</select></div>

  if(c.length) h+=`<table class="prev"><tr><th>Datum</th><th>Betrag</th><th>Kategorie</th><th>Text</th></tr>${c.slice(0,8).map(x=>`<tr style="${x.dup?'opacity:.45':''}"><td>${x.date}</td><td class="${x.type==='income'?'pos':''}">${x.type==='income'?'+':'−'}${eur(x.amount)}</td><td>${esc(cat(x.cat).name)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table>${c.length>8?`<div class="note">… und ${c.length-8} weitere</div>`:''}`;

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=()=>res(window.XLSX); sc.onerror=()=>rej(new Error('xlsx')); document.head.appendChild(sc); });
}
function chooseAccount(){
  if(S.acc!=='all') return Promise.resolve(S.acc);
  if(accounts().length===1) return Promise.resolve(accounts()[0].id);
  return new Promise(res=>openModal(`<h3>In welches Konto importieren?</h3><div class="accpick">${accounts().map(a=>`<button class="btn" data-pa="${esc(a.id)}">${svg('bank',16)}<span>${esc(a.name)}</span></button>`).join('')}</div><div class="actions"><div class="r"><button class="btn" id="paNo">Abbrechen</button></div></div>`,o=>{
    o.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{ closeModal(); res(b.dataset.pa); });
    o.querySelector('#paNo').onclick=()=>{ closeModal(); res(null); };
  }));
}
async function handleFile(f){
  if(!f) return;
  const acc=await chooseAccount(); if(!acc) return; S.importAcc=acc;
  const name=f.name||'Datei';
  try{
    if(/\.(xlsx|xls)$/i.test(name)){
      toast('Excel-Datei wird gelesen …');
      const X=await loadXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      const csv=rows.map(r=>r.map(c=>{ c = (c instanceof Date) ? `${pad(c.getDate())}.${pad(c.getMonth()+1)}.${c.getFullYear()}` : String(c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\n');
      return parseImport(csv,name);
    }
    let txt=await f.text();
    if(txt.includes(String.fromCharCode(0xFFFD))){ txt=new TextDecoder('windows-1252').decode(await f.arrayBuffer()); }
    parseImport(txt,name);
  }catch(err){ console.warn(err); toast('Datei konnte nicht gelesen werden.'); }
}
async function doImport(){
  const all=importCandidates(), fresh=all.filter(x=>!x.dup);
  S.importRows=null;
  if(!fresh.length){ render(); return toast(all.length?'Alle Buchungen waren schon vorhanden':'Keine Buchungen erkannt'); }
  const ids=[];
  const acc=S.importAcc||accounts()[0].id; fresh.forEach((x,n)=>{ const id=newId(); ids.push(id); putTx({id,...x,acc,created:Date.now()+n}); });
  render();
  const skipped=all.length-fresh.length;
  toast(`${fresh.length} → ${accName(acc)}${skipped?` · ${skipped} doppelt`:''}`,'Rückgängig',()=>{ ids.forEach(delTx); render(); });
  await writeChain;
}

  if(accounts().length<2) return toast('Mindestens ein Konto wird benötigt');
  const ids=S.tx.filter(t=>accOf(t)===id).map(t=>t.id);
  if(await confirmBox(`Konto „${accName(id)}“ löschen?${ids.length?` ${ids.length} Buchungen werden mit gelöscht.`:''}`)){ ids.forEach(delTx); S.settings.accounts=accounts().filter(a=>a.id!==id); if(S.acc===id) S.acc='all'; saveSettings(); refreshAccMenu(); toast('Konto gelöscht'); }

function txForm(t){
  const isNew=!t;
  const today=todayISO();
  const defDate = S.month===today.slice(0,7) ? today : S.month+'-01';
  t = t ? {...t} : {id:newId(), type:'expense', amount:'', date:defDate, cat:catsOf('expense')[0]?.id, note:''};
  let manualCat=!isNew;
  const catOpts=type=>catsOf(type).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  openModal(`<h3>${isNew?'Neue Buchung':'Buchung bearbeiten'}</h3>
    <div class="seg"><button data-ty="expense">− Ausgabe</button><button data-ty="income">+ Einnahme</button></div>
    <div class="field"><input id="fAmt" class="amountin" inputmode="decimal" placeholder="0,00 €" value="${t.amount!==''?String(t.amount).replace('.',','):''}"></div>
    <div class="field"><label>Notiz / Empfänger</label><input id="fNote" placeholder="z. B. REWE Wocheneinkauf" value="${esc(t.note)}"></div>
    <div class="row2"><div class="field"><label>Kategorie</label><select id="fCat"></select></div>
    <div class="field"><label>Datum</label><input id="fDate" type="date" value="${esc(t.date)}"></div></div>
    <div class="actions">${isNew?'':'<button class="btn danger" id="fDel">Löschen</button>'}<div class="r"><button class="btn" id="fCancel">Abbrechen</button><button class="btn primary" id="fSave">Speichern</button></div></div>`, o=>{
    const setType=ty=>{ t.type=ty; o.querySelectorAll('[data-ty]').forEach(b=>b.classList.toggle('on',b.dataset.ty===ty));
      const sel=o.querySelector('#fCat'); sel.innerHTML=catOpts(ty);
      if(cat(t.cat).type===ty && catsOf(ty).some(c=>c.id===t.cat)) sel.value=t.cat; else { t.cat=sel.value; manualCat=false; } };
    o.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>setType(b.dataset.ty));
    setType(t.type);
    o.querySelector('#fCat').onchange=e=>{ t.cat=e.target.value; manualCat=true; };
    o.querySelector('#fNote').oninput=e=>{ if(manualCat) return; const s=suggestCat(e.target.value,t.type); if(s){ t.cat=s; o.querySelector('#fCat').value=s; } };
    o.querySelector('#fCancel').onclick=closeModal;
    const del=o.querySelector('#fDel'); if(del) del.onclick=async()=>{ if(await confirmBox('Buchung löschen?')){ delTx(t.id); render(); toast('Gelöscht'); } };
    const save=()=>{ const a=parseAmount(o.querySelector('#fAmt').value);
      if(!isFinite(a)||a===0){ o.querySelector('#fAmt').focus(); return toast('Bitte einen Betrag eingeben'); }
      const d=o.querySelector('#fDate').value; if(!d) return toast('Bitte ein Datum wählen');
      putTx({...t, amount:Math.abs(a), date:d, cat:o.querySelector('#fCat').value, note:o.querySelector('#fNote').value.trim()});
      closeModal(); if(d.slice(0,7)!==S.month && isNew) S.month=d.slice(0,7); render(); toast(isNew?'Gespeichert':'Aktualisiert'); };
    o.querySelector('#fSave').onclick=save;
    o.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); }));
    if(isNew) setTimeout(()=>o.querySelector('#fAmt').focus(),50);
  });
}

function themeVars(t){

  return {'--bg':t.bg,'--raised':t.bg,'--sunken':mix(7),'--line':mix(10),'--line-2':mix(24),'--text':t.text,'--text-2':mix(80),'--muted':mix(62),

function applyTheme(){
  const r=document.documentElement, t=allThemes().find(x=>x.id===theme)||PRESETS[0];
  TVARS.forEach(v=>r.style.removeProperty(v));
  if(t.id==='auto'){ r.removeAttribute('data-theme'); }
  else { r.setAttribute('data-theme', lum(t.bg)<0.25?'dark':'light'); const vs=themeVars(t); for(const k in vs) r.style.setProperty(k,vs[k]); }
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content = t.bg || (matchMedia('(prefers-color-scheme: dark)').matches?'#000000':'#ffffff');

    <div class="field"><label>Name</label><input id="teName" value="${esc(t.name)}" autocomplete="off"></div>
    <div class="tfield"><label>Hintergrund</label><div class="tsw">${PALS.map(c=>`<button data-k="bg" data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" data-k="bg" value="${t.bg}"></div></div>
    <div class="tfield"><label>Text</label><div class="tsw">${['#0a0a0a','#2b2620','#1f2a22','#1f1b33','#ffffff','#e6edf7','#f2f2f7'].map(c=>`<button data-k="text" data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" data-k="text" value="${t.text}"></div></div>
    <div class="tfield"><label>Akzent</label><div class="tsw">${ACC.map(c=>`<button data-k="accent" data-c="${c}" style="background:${c}"></button>`).join('')}<input type="color" data-k="accent" value="${t.accent}"></div></div>
    <label class="tcheck"><input type="checkbox" id="teChart" ${t.chart==='accent'?'checked':''}> Kurve in Akzentfarbe</label>
    <label class="tcheck"><input type="checkbox" id="teGlow" ${t.glow?'checked':''}> Neon-Leuchten</label>
    <div class="actions">${cur?`<button class="btn danger" id="teDel">Löschen</button>`:''}<div class="r"><button class="btn" id="teNo">Abbrechen</button><button class="btn primary" id="teOk">Speichern</button></div></div>`, o=>{
    const upd=()=>{ o.querySelector('#tePrev').innerHTML=prev(); o.querySelectorAll('.tsw button').forEach(b=>b.classList.toggle('on',t[b.dataset.k].toLowerCase()===b.dataset.c)); o.querySelectorAll('input[type=color]').forEach(i=>i.value=t[i.dataset.k]); };
    o.querySelectorAll('.tsw button').forEach(b=>b.onclick=()=>{ t[b.dataset.k]=b.dataset.c; upd(); });
    o.querySelectorAll('input[type=color]').forEach(i=>i.oninput=()=>{ t[i.dataset.k]=i.value; upd(); });
    o.querySelector('#teChart').onchange=e=>{ t.chart=e.target.checked?'accent':'text'; upd(); };
    o.querySelector('#teGlow').onchange=e=>{ t.glow=e.target.checked; upd(); };
    upd();
    const back=()=>{ closeModal(); openThemes(); };
    o.querySelector('#teClose').onclick=back; o.querySelector('#teNo').onclick=back;
    o.querySelector('#teOk').onclick=()=>{ t.name=o.querySelector('#teName').value.trim()||'Mein Theme';
      S.settings.themes = cur ? list.map(x=>x.id===t.id?{...t}:x) : [...list,{...t}];
      saveSettings(); setTheme(t.id); back(); toast(`Theme „${t.name}“ gespeichert`); };
    const del=o.querySelector('#teDel'); if(del) del.onclick=()=>{ S.settings.themes=list.filter(x=>x.id!==t.id); if(theme===t.id) setTheme('auto'); saveSettings(); back(); toast('Theme gelöscht'); };
  });
}
$('#themeBtn').onclick=openThemes;
applyTheme();
$('#setBtn').innerHTML=svg('gear',17,1.8); $('#accChev').innerHTML=svg('chevR',14,2);
$('#setBtn').onclick=openSettings;


/* ---------- Events ---------- */

document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset && d.dataset.k){ d.open?S.open.add(d.dataset.k):S.open.delete(d.dataset.k); } },true);
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files')){ e.preventDefault(); document.body.classList.add('dragging'); } }));
['dragleave','dragend'].forEach(ev=>document.addEventListener(ev,e=>{ if(!e.relatedTarget) document.body.classList.remove('dragging'); }));
document.addEventListener('drop',e=>{ if(e.dataTransfer?.files?.length){ e.preventDefault(); document.body.classList.remove('dragging'); handleFile(e.dataTransfer.files[0]); } });

document.addEventListener('click', async e=>{
  const qc=e.target.closest('[data-qcat]'); if(qc){ quickSave(qc.dataset.qcat); return; }
  const pk=e.target.closest('[data-pick]'); if(pk){ openPicker(pk.dataset.pick); return; }
  if(lpFired){ lpFired=false; return; }
  const mr=e.target.closest('[data-macc]'); if(mr){ const id=mr.dataset.macc; toggleAccMenu(false); if(id==='__new') newAccount(); else setAcc(id); return; }
  const ar=e.target.closest('[data-tx]'); if(ar){ openTx(ar.dataset.tx); return; }
  const mt=e.target.closest('[data-metric]'); if(mt){ S.metric=mt.dataset.metric; render(); return; }
  const mo=e.target.closest('[data-mon]'); if(mo){ S.month=mo.dataset.mon; S.actLimit=300; render(); return; }
  const ac=e.target.closest('[data-acc]'); if(ac){ setAcc(ac.dataset.acc); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(lpFired){ lpFired=false; return; }
  const ar2=e.target.closest('[data-arename]'); if(ar2){ renameAccount(ar2.dataset.arename); return; }
  const el=e.target.closest('[data-edit],[data-act],[data-filter-cat],[data-tab-go],[data-cdel],[data-rdel],[data-xdel]'); if(!el) return;
  const st=S.settings;
  if(el.dataset.edit){ const t=S.tx.find(x=>x.id===el.dataset.edit); if(t) txForm(t); return; }
  if(el.dataset.filterCat){ S.filter={q:'',type:'all',cat:el.dataset.filterCat,all:false}; render(); goTo('sec-tx'); return; }
  if(el.dataset.tabGo){ goTo('sec-'+el.dataset.tabGo); return; }
  if(el.dataset.cdel){ const id=el.dataset.cdel; const n=S.tx.filter(t=>t.cat===id).length;
    if(await confirmBox(`Kategorie „${cat(id).name}“ löschen?${n?` ${n} Buchungen werden „Ohne Kategorie“.`:''}`)){ st.categories=st.categories.filter(c=>c.id!==id); st.rules=st.rules.filter(r=>r.cat!==id); saveSettings(); } return; }
  if(el.dataset.rdel){ st.recurring=(st.recurring||[]).filter(r=>r.id!==el.dataset.rdel); saveSettings(); return; }
  if(el.dataset.xdel){ st.rules=st.rules.filter(r=>r.id!==el.dataset.xdel); saveSettings(); return; }
  const act=el.dataset.act;
  if(act==='act-more'){ S.actLimit=(S.actLimit||300)+300; refreshActivity(); return; }
  if(act==='new-acc'){ newAccount(); return; }
  if(act==='qsign'){ S.q.type=S.q.type==='expense'?'income':'expense'; render(); return; }
  if(act==='book-due'){ const due=dueRecurring(); const key=monthKey(new Date());
    for(const r of due){ putTx({id:newId(),type:r.type,amount:r.amount,date:`${key}-${pad(Math.min(r.day||1,28))}`,cat:r.cat,note:r.note||'',created:Date.now()}); r.last=key; }
    saveSettings(); toast(`${due.length} Buchung${due.length>1?'en':''} gebucht`); }
  if(act==='add-cat'){ const name=$('#ncName').value.trim(); if(!name) return toast('Bitte einen Namen eingeben');
    st.categories.push({id:'c'+rid(),name,ico:S.newIco||'tag',type:$('#ncType').value,budget:0}); S.newIco=null; saveSettings(); }
  if(act==='add-rec'){ const a=parseAmount($('#nrAmt').value); if(!isFinite(a)||!a) return toast('Bitte einen Betrag eingeben');
    const day=Math.min(28,Math.max(1,parseInt($('#nrDay').value)||1));
    st.recurring=st.recurring||[]; st.recurring.push({id:rid(),type:$('#nrType').value,amount:Math.abs(a),day,cat:$('#nrCat').value,note:$('#nrNote').value.trim(),last:''}); saveSettings(); toast('Wiederkehrende Buchung angelegt'); }
  if(act==='add-rule'){ const kw=$('#nxKw').value.trim().toLowerCase(); if(!kw) return toast('Bitte ein Stichwort eingeben');
    st.rules.unshift({id:rid(),kw,cat:$('#nxCat').value}); saveSettings(); }
  if(act==='parse-csv'){ const t=$('#csvText').value; if(!t.trim()) return toast('Bitte CSV-Text einfügen'); const acc=await chooseAccount(); if(!acc) return; S.importAcc=acc; parseImport(t,'eingefügter Text'); }
  if(act==='cancel-import'){ S.importRows=null; render(); }
  if(act==='parse-csv'){ $('#setSheet')?.remove(); setTimeout(()=>goTo('sec-upload'),50); }
  if(act==='do-import') doImport();
  if(act==='export'){ const rows=[['Datum','Konto','Art','Betrag','Kategorie','Notiz']].concat(curTx().slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,accName(accOf(t)),t.type==='income'?'Einnahme':'Ausgabe',(t.type==='income'?t.amount:-t.amount).toFixed(2).replace('.',','),cat(t.cat).name,t.note||'']));
    const csv=rows.map(r=>r.map(c=>/[;"\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(';')).join('\n');
    try{ await navigator.clipboard.writeText(csv); toast('CSV kopiert – in Excel/Datei einfügen'); }
    catch(err){ openModal(`<h3>CSV-Export</h3><textarea rows="12" readonly>${esc(csv)}</textarea><div class="actions"><div class="r"><button class="btn" onclick="this.closest('.overlay').remove()">Schließen</button></div></div>`,o=>{const ta=o.querySelector('textarea'); ta.focus(); ta.select();}); } }
  if(act==='wipe'){ const L=curTx(); if(await confirmBox(`Wirklich ${L.length} Buchungen${S.acc==='all'?' aus allen Konten':' aus „'+accName(S.acc)+'“'} löschen?`,'Löschen')){ const ids=L.map(t=>t.id); for(const id of ids) delTx(id); render(); toast('Alle Buchungen gelöscht'); } }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.id==='qAmt'||e.target.id==='qNote')){
    e.preventDefault();
    if(e.target.id==='qAmt' && !S.q.note){ $('#qNote').focus(); return; }
    const sug=quickSuggest()||quickCats()[0]?.id; if(sug) quickSave(sug);
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='actQ'){ S.aq=e.target.value; S.actLimit=300; refreshActivity(); const b=$('#actList'); if(b) b.scrollTop=0; return; }
  const t=e.target;
  if(t.id==='qAmt'){ S.q.amt=t.value; }
  if(t.id==='qNote'){ S.q.note=t.value; const sug=quickSuggest(); document.querySelectorAll('#qchips .chipbtn').forEach(b=>b.classList.toggle('sug',b.dataset.qcat===sug)); }
});
document.addEventListener('change', e=>{
  const t=e.target, st=S.settings;
  if(t.id==='ftype'){ S.filter.type=t.value; render(); }
  if(t.id==='fcat'){ S.filter.cat=t.value; render(); }
  if(t.id==='fall'){ S.filter.all=t.checked; render(); }
  if(t.dataset.assign!==undefined && t.value){ assignPayee(t.dataset.assign,t.dataset.atype,t.value); return; }
  if(t.id==='accSel'){ if(t.value==='__manage'){ t.value=S.acc; S.open.add('accs'); openSettings(); return; } if(t.value==='__new'){ t.value=S.acc; newAccount(); } else setAcc(t.value); return; }
  if(t.dataset.aname){ const a=accounts().find(a=>a.id===t.dataset.aname); const v=t.value.trim(); if(a&&v&&v!==a.name){ S.settings.accounts=accounts().map(x=>x.id===a.id?{...x,name:v}:x); saveSettings(); } return; }
  if(t.dataset.budget){ const c=st.categories.find(c=>c.id===t.dataset.budget); const v=parseAmount(t.value); const nb=isFinite(v)&&v>0?Math.round(v*100)/100:0; if(c && c.budget!==nb){ c.budget=nb; saveSettings(); } }
  if(t.dataset.cname){ const c=st.categories.find(c=>c.id===t.dataset.cname); const v=t.value.trim(); if(c&&v&&v!==c.name){ c.name=v; saveSettings(); } }
  if(t.dataset.cicon){ const c=st.categories.find(c=>c.id===t.dataset.cicon); const v=t.value.trim(); if(c&&v&&v!==c.icon){ c.icon=v; saveSettings(); } }
  if(t.id==='nrType'){ $('#nrCat').innerHTML=catsOf(t.value).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join(''); }
  if(t.dataset.map){ S.importRows.map[t.dataset.map]=+t.value; $('#importArea').innerHTML=importAreaHTML(); }
  if(t.id==='upFile' && t.files[0]){ handleFile(t.files[0]); t.value=''; }
});

init();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
